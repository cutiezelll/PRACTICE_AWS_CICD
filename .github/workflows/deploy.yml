name: Build and Deploy Flutter Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Checkout Flutter source repository
        uses: actions/checkout@v4
        with:
          repository: cutiezelll/IT314AB_Estimo
          ref: feature/conditional-ui
          path: source

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: source/Flutter Projects/my_first_flutter_app
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: source/Flutter Projects/my_first_flutter_app
        run: flutter build web --release
