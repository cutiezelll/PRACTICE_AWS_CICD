name: Build and Deploy Flutter Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Checkout Flutter source repository
        uses: actions/checkout@v4
        with:
          repository: cutiezelll/IT314AB_Estimo
          ref: feature/conditional-ui
          path: source

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: source/Flutter Projects/my_first_flutter_app
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: source/Flutter Projects/my_first_flutter_app
        run: flutter build web --release

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_PORT: ${{ secrets.LIGHTSAIL_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lightsail_key
          chmod 600 ~/.ssh/lightsail_key
          ssh-keyscan -p "$LIGHTSAIL_PORT" -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to AWS Lightsail
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_PORT: ${{ secrets.LIGHTSAIL_PORT }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/lightsail_key -p $LIGHTSAIL_PORT" \
            "source/Flutter Projects/my_first_flutter_app/build/web/" \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:/var/www/html/"
